---
- name: Upgrade packages
  ansible.builtin.dnf: # noqa package-latest
    name: "*"
    update_cache: true
    state: latest

- name: Autoremove unneeded packages
  ansible.builtin.dnf:
    autoremove: true

# Reports CHANGED if host needs reboot, OK otherwise
- name: Check if host needs reboot
  check_mode: false
  changed_when: _reboot_check.rc == 1
  failed_when: _reboot_check.rc not in (0, 1)
  register: _reboot_check # noqa: var-naming[no-role-prefix]
  ansible.builtin.command: needs-restarting -r
