---
- name: Remove container apps
  hosts: cx_container_app
  gather_facts: true
  gather_subset:
    - "!min"
    - distribution
  roles:
    - cx_container_app
  vars:
    cx_container_app_state: absent

- name: Remove k8s apps
  hosts: cx_k8s_app
  roles:
    - cx_k8s_app
  vars:
    cx_k8s_app_state: absent
